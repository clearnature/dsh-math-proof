# 全部门禁：14 个入口（schema 自检 + 13 套回归）
#
# 这些门禁是**纯 node 内建模块**实现的（零依赖），所以在裸 CI 里也能跑：
# 没有 dsh 安装、没有市场快照、没有 Agda 仓库时，相关断言会显式 SKIP（⏭）而不是假绿。
name: gates

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  check-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - name: 一键门禁（期望 CHECK_ALL_OK 14/14）
        run: node math-proof/scripts/check-all.mjs
